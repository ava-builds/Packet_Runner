<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Network Town">
    <meta name="theme-color" content="#aad3fb">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <title>Packet Runner: Network Town</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aad3fb;
            /* the game handles every touch itself: no page scroll, pull-to-refresh, double-tap zoom or text selection */
            touch-action: none; overscroll-behavior: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        }
        /* the game fills the visible screen (dvh follows iPhone Safari's address bar) and stays clear of the notch and home bar */
        #app {
            position: fixed; inset: 0; height: 100vh; height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box; background: #aad3fb;
        }
        #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 600 18px -apple-system, system-ui, sans-serif; color: #0d1a50; }
    </style>
    <script>
        // iPhone Safari zooms the whole page with a pinch even when the page asks it not to: stop that, the game zooms its own town
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
            document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
        // sound is only allowed after the player has touched the page: wake the audio up on the first touch
        function unlockAudio() {
            try {
                var Ctx = window.AudioContext || window.webkitAudioContext;
                var ctx = window.__prAudio || (window.__prAudio = new Ctx());
                if (ctx.state === 'suspended') ctx.resume();
            } catch (e) { }
        }
        ['pointerdown', 'touchend', 'keydown'].forEach(function (name) {
            window.addEventListener(name, unlockAudio, { passive: true });
        });
    </script>
    <script src="web.js"></script>
</head>
<body>
    <div id="app"><div id="loading">Loading Network Town…</div></div>
</body>
</html>
